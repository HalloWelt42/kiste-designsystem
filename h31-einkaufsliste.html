    <title>Kiste - Einkaufsliste</title>
    <style>
      /* Nur Anordnung: links das Kästchen mit Name und Unterzeile, rechts der Vorschlag. */
      .s-kaufzeile {
        grid-template-columns: minmax(0, 1fr) auto;
      }
    </style>

  <body data-seite="mehr" data-leuchte="verbunden">
    <div class="h-huelle">
      <header class="h-kopf">
        <a class="h-kopf-zurueck" href="h48-mehr.html"><i class="fa-solid fa-chevron-left"></i><span>Mehr</span></a>
        <div class="h-kopf-titel">Einkaufsliste</div>
      </header>
      <main class="h-rollfeld">
        <div class="h-titelblock">
          <h1>Einkaufsliste</h1>
          <p class="h-titelblock-unter">4 Einträge fehlen</p>
        </div>

        <section class="h-abschnitt">
          <div class="h-abschnitt-kopf"><h2>Unter dem Mindestbestand</h2><span class="h-abschnitt-zahl">2 Einträge</span></div>
          <div class="h-liste">
            <div class="h-zeile s-kaufzeile">
              <button class="h-kaestchen" type="button" role="checkbox" aria-checked="false">
                <span class="h-kaestchen-feld"><i class="fa-solid fa-check"></i></span>
                <span class="h-kaestchen-text">Spülmittel<small>noch 1 Flasche, mindestens 2</small></span>
              </button>
              <span class="h-pille">1 Flasche</span>
            </div>
            <div class="h-zeile s-kaufzeile">
              <button class="h-kaestchen an" type="button" role="checkbox" aria-checked="true">
                <span class="h-kaestchen-feld"><i class="fa-solid fa-check"></i></span>
                <span class="h-kaestchen-text">Pflaster<small>noch 1 Packung, mindestens 2</small></span>
              </button>
              <span class="h-pille">1 Packung</span>
            </div>
          </div>
        </section>

        <section class="h-abschnitt">
          <div class="h-abschnitt-kopf"><h2>Aufgebraucht</h2><span class="h-abschnitt-zahl">2 Einträge</span></div>
          <div class="h-liste">
            <div class="h-zeile s-kaufzeile">
              <button class="h-kaestchen" type="button" role="checkbox" aria-checked="false">
                <span class="h-kaestchen-feld"><i class="fa-solid fa-check"></i></span>
                <span class="h-kaestchen-text">Butter<small>Kühlschrank</small></span>
              </button>
              <span class="h-pille">1 Stück</span>
            </div>
            <div class="h-zeile s-kaufzeile">
              <button class="h-kaestchen" type="button" role="checkbox" aria-checked="false">
                <span class="h-kaestchen-feld"><i class="fa-solid fa-check"></i></span>
                <span class="h-kaestchen-text">Schmerztabletten<small>Hausapotheke</small></span>
              </button>
              <span class="h-pille">1 Packung</span>
            </div>
          </div>
          <button class="h-knopf primaer breit" type="button"><i class="fa-solid fa-cart-shopping"></i> Abgehakte einbuchen</button>
          <p class="h-klein h-leise">Bucht die Vorschläge der abgehakten Einträge als Einkauf.</p>
        </section>
      </main>
