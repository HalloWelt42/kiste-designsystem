<html lang="de" data-oberflaeche="handy" data-thema="hell">
  <head>
    <!-- block:kopf-handy -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/fraunces/full.css" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/work-sans/index.css" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/jetbrains-mono/index.css" />
    <link rel="stylesheet" href="stil/00-schichten.css" />
    <style>
      @import url("schriften/@fortawesome/fontawesome-free/css/fontawesome.css") layer(icons);
      @import url("schriften/@fortawesome/fontawesome-free/css/solid.css") layer(icons);
      @import url("schriften/@fortawesome/fontawesome-free/css/regular.css") layer(icons);
    </style>
    <link rel="stylesheet" href="stil/10-marken.css" />
    <link rel="stylesheet" href="stil/20-zeichen.css" />
    <link rel="stylesheet" href="stil/handy/40-masse.css" />
    <link rel="stylesheet" href="stil/handy/41-grund.css" />
    <link rel="stylesheet" href="stil/handy/42-huelle.css" />
    <link rel="stylesheet" href="stil/handy/43-bausteine.css" />
    <link rel="stylesheet" href="stil/handy/44-ansichten.css" />
    <script src="_vorab.js"></script>
    <script src="_seiten.js" defer></script>
    <script src="_gemeinsam.js" defer></script>
    <!-- /block:kopf-handy -->
    <title>Kiste - Anmeldung: zweiter Schritt und Sperre</title>
  </head>
  <body data-leuchte="verbunden">
    <div class="h-huelle vollflaeche">
      <header class="h-kopf">
        <a class="h-kopf-zurueck" href="h02-anmeldung.html"><i class="fa-solid fa-chevron-left"></i><span>Anmeldung</span></a>
        <div class="h-kopf-titel">Anmeldung bestätigen</div>
      </header>
      <main class="h-rollfeld">
        <div class="h-titelblock">
          <h1>Anmeldung bestätigen</h1>
          <p class="h-titelblock-unter">alex@zuhause.example</p>
        </div>

        <section class="h-abschnitt">
          <div class="h-abschnitt-kopf"><h2>Zweiter Schritt</h2></div>
          <label class="h-feld">
            <span class="h-feld-name">Code aus der Anmelde-App</span>
            <input class="h-eingabe code" type="text" inputmode="numeric" maxlength="6" value="482915" autocomplete="one-time-code" />
            <span class="h-feld-hinweis">Sechs Ziffern, alle 30 Sekunden neu.</span>
          </label>
          <a class="h-knopf primaer haupt" href="h04-start.html">Bestätigen</a>
          <a class="h-link" href="#">Wiederherstellungscode verwenden <i class="fa-solid fa-chevron-right"></i></a>
        </section>

        <section class="h-abschnitt">
          <div class="h-abschnitt-kopf"><h2>Gesperrt</h2></div>
          <div class="h-hinweis gefahr"><i class="fa-solid fa-triangle-exclamation"></i><p>Zu viele Versuche. Neuer Versuch in 4 Minuten 30 Sekunden.</p></div>
          <label class="h-feld">
            <span class="h-feld-name">Code aus der Anmelde-App</span>
            <input class="h-eingabe code" type="text" inputmode="numeric" maxlength="6" disabled />
          </label>
          <button class="h-knopf primaer haupt gesperrt" type="button" disabled>Bestätigen</button>
        </section>
      </main>
    </div>
  </body>
</html>
