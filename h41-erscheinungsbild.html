<!doctype html>
<html lang="de" data-oberflaeche="handy" data-thema="hell">
  <head>
    <!-- block:kopf-handy -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/fraunces/full.css" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/work-sans/index.css" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/jetbrains-mono/index.css" />
    <link rel="stylesheet" href="stil/00-schichten.css" />
    <style>
      @import url("schriften/@fortawesome/fontawesome-free/css/fontawesome.css") layer(icons);
      @import url("schriften/@fortawesome/fontawesome-free/css/solid.css") layer(icons);
      @import url("schriften/@fortawesome/fontawesome-free/css/regular.css") layer(icons);
    </style>
    <link rel="stylesheet" href="stil/10-marken.css" />
    <link rel="stylesheet" href="stil/20-zeichen.css" />
    <link rel="stylesheet" href="stil/handy/40-masse.css" />
    <link rel="stylesheet" href="stil/handy/41-grund.css" />
    <link rel="stylesheet" href="stil/handy/42-huelle.css" />
    <link rel="stylesheet" href="stil/handy/43-bausteine.css" />
    <link rel="stylesheet" href="stil/handy/44-ansichten.css" />
    <script src="_vorab.js"></script>
    <script src="_seiten.js" defer></script>
    <script src="_gemeinsam.js" defer></script>
    <!-- /block:kopf-handy -->
    <title>Kiste - Erscheinungsbild</title>
  </head>
  <body data-seite="lager" data-leuchte="verbunden">
    <div class="h-huelle vollflaeche">
      <header class="h-kopf">
        <a class="h-kopf-zurueck" href="h40-bearbeiten.html"><i class="fa-solid fa-chevron-left"></i><span>Bearbeiten</span></a>
        <div class="h-kopf-titel">Erscheinungsbild</div>
      </header>
      <main class="h-rollfeld">
        <div class="h-titelblock">
          <h1>Erscheinungsbild</h1>
        </div>
        <div class="h-wahlreihe" role="tablist" aria-label="Was den Eintrag zeigt">
          <button class="h-wahl" type="button" role="tab" aria-selected="false">Bild</button>
          <button class="h-wahl aktiv" type="button" role="tab" aria-selected="true">Icon</button>
          <button class="h-wahl" type="button" role="tab" aria-selected="false">Nichts</button>
        </div>
        <section class="h-abschnitt">
          <div class="h-abschnitt-kopf"><h2>Farbton</h2></div>
          <div class="h-toene" role="group" aria-label="Farbton wählen">
            <button class="h-ton" type="button" aria-label="Kein Farbton" aria-pressed="false"><i class="fa-solid fa-ban"></i></button>
            <button class="h-ton gewaehlt" type="button" data-ton="messing" aria-label="Farbton Messing" aria-pressed="true"><i class="fa-solid fa-check"></i></button>
            <button class="h-ton" type="button" data-ton="moos" aria-label="Farbton Moos" aria-pressed="false"><i class="fa-solid fa-check"></i></button>
            <button class="h-ton" type="button" data-ton="ochsenblut" aria-label="Farbton Ochsenblut" aria-pressed="false"><i class="fa-solid fa-check"></i></button>
            <button class="h-ton" type="button" data-ton="tinte" aria-label="Farbton Tinte" aria-pressed="false"><i class="fa-solid fa-check"></i></button>
          </div>
        </section>
        <section class="h-abschnitt">
          <div class="h-abschnitt-kopf"><h2>Icon</h2></div>
          <div class="h-suchfeld">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input class="h-eingabe" type="search" placeholder="Icon suchen" aria-label="Icon suchen" />
          </div>
          <div class="h-iconraster" role="group" aria-label="Icon wählen">
            <button class="h-iconwahl" type="button" aria-label="Kiste" aria-pressed="false"><i class="fa-solid fa-box"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Schneeflocke" aria-pressed="false"><i class="fa-solid fa-snowflake"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Buch" aria-pressed="false"><i class="fa-solid fa-book"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Hemd" aria-pressed="false"><i class="fa-solid fa-shirt"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Werkzeugkasten" aria-pressed="false"><i class="fa-solid fa-toolbox"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Tabletten" aria-pressed="false"><i class="fa-solid fa-pills"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Auto" aria-pressed="false"><i class="fa-solid fa-car"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Pflanze" aria-pressed="false"><i class="fa-solid fa-seedling"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Sofa" aria-pressed="false"><i class="fa-solid fa-couch"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Badewanne" aria-pressed="false"><i class="fa-solid fa-bath"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Bett" aria-pressed="false"><i class="fa-solid fa-bed"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Rechner" aria-pressed="false"><i class="fa-solid fa-laptop"></i></button>
            <button class="h-iconwahl gewaehlt" type="button" aria-label="Spüle" aria-pressed="true"><i class="fa-solid fa-sink"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Ei" aria-pressed="false"><i class="fa-solid fa-egg"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Käse" aria-pressed="false"><i class="fa-solid fa-cheese"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Glas" aria-pressed="false"><i class="fa-solid fa-jar"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Flasche" aria-pressed="false"><i class="fa-solid fa-bottle-water"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Getreide" aria-pressed="false"><i class="fa-solid fa-wheat-awn"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Werkzeug" aria-pressed="false"><i class="fa-solid fa-screwdriver-wrench"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Hammer" aria-pressed="false"><i class="fa-solid fa-hammer"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Schlüssel" aria-pressed="false"><i class="fa-solid fa-key"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Glühlampe" aria-pressed="false"><i class="fa-solid fa-lightbulb"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Stecker" aria-pressed="false"><i class="fa-solid fa-plug"></i></button>
            <button class="h-iconwahl" type="button" aria-label="Besen" aria-pressed="false"><i class="fa-solid fa-broom"></i></button>
          </div>
        </section>
        <section class="h-abschnitt">
          <div class="h-abschnitt-kopf"><h2>Vorschau</h2></div>
          <div class="h-vorschau">
            <div class="h-liste">
              <div class="h-zeile">
                <span class="z-erscheinung" data-ton="messing"><i class="fa-solid fa-sink"></i></span>
                <span class="h-zeile-text">
                  <span class="h-zeile-name">Spülenschrank</span>
                  <span class="h-zeile-unter"><span class="z-code">S6P1</span><span>2 Einträge, 4 Gegenstände</span></span>
                </span>
                <span class="h-zeile-ende"><i class="fa-solid fa-chevron-right"></i></span>
              </div>
            </div>
          </div>
        </section>
      </main>
      <footer class="h-fuss">
        <button class="h-knopf primaer haupt" type="button">Speichern</button>
      </footer>
    </div>
  </body>
</html>
