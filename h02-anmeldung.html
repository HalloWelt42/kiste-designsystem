      @import url("schriften/@fortawesome/fontawesome-free/css/solid.css") layer(icons);

    <!-- /block:kopf-handy -->
    <title>Kiste - Anmeldung</title>
    <style>
      /* Dienstzeile unter dem Hauptknopf: mittig. */
      .s-dienst {
        justify-content: center;
        padding-block-start: var(--h-a1);
      }
    </style>
  </head>
  <body data-leuchte="verbunden">
    <div class="h-huelle vollflaeche">
      <main class="h-rollfeld mittig">
        <div class="h-anmeldung">
          <div class="h-anmeldung-marke">
            <h1 class="z-marke"><i class="fa-solid fa-table-cells-large"></i> Kiste</h1>
            <p class="h-titelblock-unter">Was liegt wo, und wie viel davon</p>
          </div>
          <div class="h-anmeldung-formular">
            <label class="h-feld">
              <span class="h-feld-name">Adresse</span>
              <input class="h-eingabe" type="email" inputmode="email" value="alex@zuhause.example" autocomplete="username" />
            </label>
            <label class="h-feld">
              <span class="h-feld-name">Kennwort</span>
              <input class="h-eingabe" type="password" autocomplete="current-password" />
            </label>
          </div>
        </div>
      </main>
      <footer class="h-fuss">
        <a class="h-knopf primaer haupt" href="h03-anmeldung-zweiter-schritt.html">Anmelden</a>
        <div class="h-reihe s-dienst">
          <span class="h-leuchte"></span>
          <span class="h-klein">kiste.example:8480</span>
          <span class="h-klein" data-fassung></span>
        </div>
      </footer>
    </div>
  </body>
</html>
