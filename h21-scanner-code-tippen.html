<!doctype html>
<html lang="de" data-oberflaeche="handy" data-thema="hell">
  <head>
    <!-- block:kopf-handy -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/fraunces/full.css" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/work-sans/index.css" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/jetbrains-mono/index.css" />
    <link rel="stylesheet" href="stil/00-schichten.css" />
    <style>
      @import url("schriften/@fortawesome/fontawesome-free/css/fontawesome.css") layer(icons);
      @import url("schriften/@fortawesome/fontawesome-free/css/solid.css") layer(icons);
      @import url("schriften/@fortawesome/fontawesome-free/css/regular.css") layer(icons);
    </style>
    <link rel="stylesheet" href="stil/10-marken.css" />
    <link rel="stylesheet" href="stil/20-zeichen.css" />
    <link rel="stylesheet" href="stil/handy/40-masse.css" />
    <link rel="stylesheet" href="stil/handy/41-grund.css" />
    <link rel="stylesheet" href="stil/handy/42-huelle.css" />
    <link rel="stylesheet" href="stil/handy/43-bausteine.css" />
    <link rel="stylesheet" href="stil/handy/44-ansichten.css" />
    <script src="_vorab.js"></script>
    <script src="_seiten.js" defer></script>
    <script src="_gemeinsam.js" defer></script>
    <!-- /block:kopf-handy -->
    <title>Kiste - Scanner: Code tippen</title>
  </head>
  <body data-leuchte="verbunden">
    <div class="h-scanner">
      <header class="h-scanner-kopf">
        <a class="h-scanner-knopf" href="h06-behaelter.html" aria-label="Scanner schließen"><i class="fa-solid fa-xmark"></i></a>
        <h1>Scanner</h1>
        <button class="h-scanner-knopf" type="button" aria-label="Leuchte einschalten"><i class="fa-solid fa-bolt"></i></button>
      </header>

      <div class="h-scanner-modi" role="tablist" aria-label="Was der Scan tut">
        <button class="h-scanner-modus aktiv" type="button" role="tab" aria-selected="true">Einbuchen</button>
        <button class="h-scanner-modus" type="button" role="tab" aria-selected="false">Verbrauchen</button>
        <button class="h-scanner-modus" type="button" role="tab" aria-selected="false">Nachschlagen</button>
      </div>

      <div class="h-scanner-ziel">
        <i class="fa-solid fa-location-dot"></i>
        <span><small>Neues kommt nach</small><strong>Kühlschrank</strong></span>
        <button class="h-scanner-link" type="button">Ändern</button>
      </div>

      <div class="h-scanner-sucher">
        <p class="h-scanner-hinweis"><strong>Die Kamera ist nicht freigegeben</strong>Erlaube sie in den Einstellungen des Geräts, oder tippe den Code.</p>
      </div>

      <footer class="h-scanner-fuss">
        <button class="h-knopf" type="button" data-zeige="#schleier, #blatt-code">Code tippen</button>
        <a class="h-knopf primaer" href="h06-behaelter.html">Fertig</a>
      </footer>
    </div>

    <div class="h-schleier" id="schleier"></div>

    <section class="h-blatt" id="blatt-code" role="dialog" aria-modal="true" aria-labelledby="blatt-code-titel">
      <header class="h-blatt-kopf">
        <h2 class="h-blatt-titel" id="blatt-code-titel">Code tippen</h2>
        <button class="h-symbolknopf nackt" type="button" aria-label="Schließen" data-zeige="#schleier, #blatt-code"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div class="h-blatt-rumpf">
        <label class="h-feld">
          <span class="h-feld-name">Code oder Strichcode</span>
          <input class="h-eingabe gross" type="text" value="m3t7" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" />
          <span class="h-feld-deutung"><i class="fa-solid fa-check"></i> Etikett M3T7: Milch im Kühlschrank</span>
        </label>
      </div>
      <footer class="h-blatt-fuss">
        <a class="h-knopf primaer haupt" href="h17-scanner-einbuchen.html">Übernehmen</a>
      </footer>
    </section>
  </body>
</html>
