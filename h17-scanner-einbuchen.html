    <title>Kiste - Scanner: Einbuchen</title>
  </head>
  <body data-leuchte="verbunden">
    <div class="h-scanner">
      <header class="h-scanner-kopf">
        <a class="h-scanner-knopf" href="h06-behaelter.html" aria-label="Scanner schließen"><i class="fa-solid fa-xmark"></i></a>
        <h1>Scanner</h1>
        <button class="h-scanner-knopf" type="button" aria-label="Leuchte einschalten"><i class="fa-solid fa-bolt"></i></button>
      </header>

      <div class="h-scanner-modi" role="tablist" aria-label="Was der Scan tut">
        <button class="h-scanner-modus aktiv" type="button" role="tab" aria-selected="true">Einbuchen</button>
        <button class="h-scanner-modus" type="button" role="tab" aria-selected="false">Verbrauchen</button>
        <button class="h-scanner-modus" type="button" role="tab" aria-selected="false">Nachschlagen</button>
        <button class="h-scanner-modus" type="button" role="tab" aria-selected="false">Umräumen</button>
      </div>

      <div class="h-scanner-ziel">
        <i class="fa-solid fa-location-dot"></i>
        <span><small>Neues kommt nach</small><strong>Kühlschrank</strong></span>
        <a class="h-scanner-link" href="h64-zielort-waehlen.html">Ändern</a>
      </div>

      <div class="h-scanner-anzahl mehr">
        <i class="fa-solid fa-layer-group"></i>
        <span>Nächster Scan zählt 6, danach wieder 1</span>
        <div class="h-stufen">
          <button type="button" aria-label="Einer weniger"><i class="fa-solid fa-minus"></i></button>
          <span class="h-stufen-wert">6</span>
          <button type="button" aria-label="Einer mehr"><i class="fa-solid fa-plus"></i></button>
        </div>
      </div>

      <div class="h-scanner-sucher">
        <div class="h-scanner-rahmen gut"></div>
        <p class="h-scanner-hinweis"><strong>Code in den Rahmen halten</strong>Etikett, Strichcode oder Buchnummer</p>
      </div>

      <div class="h-scanner-unten">
        <div class="h-scanner-ergebnis" role="status">
          <div class="h-scanner-ergebnis-kopf">
            <span class="z-erscheinung"><i class="fa-solid fa-cow"></i></span>
            <span class="h-scanner-ergebnis-text"><strong>Milch</strong><small>1 Tetrapack dazu, jetzt 4 Tetrapack</small></span>
          </div>
          <div class="h-reihe">
            <button class="h-knopf" type="button">Rückgängig</button>
            <a class="h-knopf" href="h73-scanner-haltbarkeit.html"><i class="fa-solid fa-camera"></i> Haltbarkeit</a>
          </div>
        </div>

        <div class="h-scanner-protokoll" aria-label="Zuletzt gebucht">
          <div class="h-scanner-protokoll-zeile"><i class="fa-solid fa-plus"></i><strong>Joghurt</strong><span>1 Becher dazu</span></div>
          <div class="h-scanner-protokoll-zeile"><i class="fa-solid fa-plus"></i><strong>Apfelsaft</strong><span>6 Flaschen dazu</span></div>
          <div class="h-scanner-protokoll-zeile"><i class="fa-solid fa-location-dot"></i><strong>Kühlschrank</strong><span>als Ziel gesetzt</span></div>
        </div>
      </div>

      <footer class="h-scanner-fuss">
        <a class="h-knopf" href="h21-scanner-code-tippen.html">Code tippen</a>
        <a class="h-knopf primaer" href="h06-behaelter.html">Fertig</a>
      </footer>
    </div>
  </body>
</html>
