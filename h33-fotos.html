<!doctype html>
<html lang="de" data-oberflaeche="handy" data-thema="hell">
  <head>
    <!-- block:kopf-handy -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/fraunces/full.css" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/work-sans/index.css" />
    <link rel="stylesheet" href="schriften/@fontsource-variable/jetbrains-mono/index.css" />
    <link rel="stylesheet" href="stil/00-schichten.css" />
    <style>
      @import url("schriften/@fortawesome/fontawesome-free/css/fontawesome.css") layer(icons);
      @import url("schriften/@fortawesome/fontawesome-free/css/solid.css") layer(icons);
      @import url("schriften/@fortawesome/fontawesome-free/css/regular.css") layer(icons);
    </style>
    <link rel="stylesheet" href="stil/10-marken.css" />
    <link rel="stylesheet" href="stil/20-zeichen.css" />
    <link rel="stylesheet" href="stil/handy/40-masse.css" />
    <link rel="stylesheet" href="stil/handy/41-grund.css" />
    <link rel="stylesheet" href="stil/handy/42-huelle.css" />
    <link rel="stylesheet" href="stil/handy/43-bausteine.css" />
    <link rel="stylesheet" href="stil/handy/44-ansichten.css" />
    <script src="_vorab.js"></script>
    <script src="_seiten.js" defer></script>
    <script src="_gemeinsam.js" defer></script>
    <!-- /block:kopf-handy -->
    <title>Kiste - Fotos</title>
    <style>
      /* Nur Anordnung: die zwei Handlungen eines Fotos teilen sich die Breite. */
      .s-knoepfe { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--h-a2); }
    </style>
  </head>
  <body data-seite="lager" data-leuchte="verbunden">
    <div class="h-huelle vollflaeche">
      <header class="h-kopf">
        <a class="h-kopf-zurueck" href="h40-bearbeiten.html"><i class="fa-solid fa-chevron-left"></i><span>Bearbeiten</span></a>
        <div class="h-kopf-titel">Fotos</div>
      </header>
      <main class="h-rollfeld">
        <div class="h-titelblock">
          <h1>Fotos</h1>
          <p class="h-titelblock-unter">Bohrmaschine, 2 Fotos</p>
        </div>

        <div class="h-karte">
          <a class="h-bild" href="h36-bildbetrachter.html" aria-label="Foto 1 von 2 groß ansehen"><img src="bilder/foto-bohrmaschine.svg" alt="Bohrmaschine auf der Werkbank" /></a>
          <div class="h-reihe verteilt">
            <span class="h-pille messing">Titelbild</span>
            <span class="h-klein h-leise">30.09.2026, Alex</span>
          </div>
          <div class="s-knoepfe">
            <button class="h-knopf" type="button"><i class="fa-solid fa-rotate-right"></i> Drehen</button>
            <button class="h-knopf" type="button" data-zeige="#schleier, #blatt-entfernen"><i class="fa-solid fa-trash-can"></i> Entfernen</button>
          </div>
        </div>

        <div class="h-karte">
          <a class="h-bild" href="h36-bildbetrachter.html" aria-label="Foto 2 von 2 groß ansehen"><img src="bilder/foto-typenschild.svg" alt="Typenschild der Bohrmaschine" /></a>
          <div class="h-reihe verteilt">
            <button class="h-link" type="button"><i class="fa-solid fa-star"></i> Als Titelbild</button>
            <span class="h-klein h-leise">30.09.2026, Alex</span>
          </div>
          <div class="s-knoepfe">
            <button class="h-knopf" type="button"><i class="fa-solid fa-rotate-right"></i> Drehen</button>
            <button class="h-knopf" type="button" data-zeige="#schleier, #blatt-entfernen"><i class="fa-solid fa-trash-can"></i> Entfernen</button>
          </div>
        </div>
      </main>
      <footer class="h-fuss">
        <button class="h-knopf primaer haupt" type="button"><i class="fa-solid fa-camera"></i> Foto hinzufügen</button>
      </footer>
    </div>

    <div class="h-schleier" id="schleier" hidden></div>

    <section class="h-blatt" id="blatt-entfernen" role="alertdialog" aria-modal="true" aria-labelledby="blatt-entfernen-titel" hidden>
      <header class="h-blatt-kopf">
        <h2 class="h-blatt-titel" id="blatt-entfernen-titel">Foto entfernen?</h2>
        <button class="h-symbolknopf nackt" type="button" aria-label="Schließen" data-zeige="#schleier, #blatt-entfernen"><i class="fa-solid fa-xmark"></i></button>
      </header>
      <div class="h-blatt-rumpf">
        <p>Das Foto wird gelöscht und lässt sich nicht zurückholen.</p>
      </div>
      <footer class="h-blatt-fuss">
        <button class="h-halten" type="button" style="--stand: 0"><span class="h-halten-ring"></span> Halten zum Entfernen</button>
        <button class="h-knopf still breit" type="button" data-zeige="#schleier, #blatt-entfernen">Abbrechen</button>
      </footer>
    </section>
  </body>
</html>
